[project]
name = "renice-win-py"
version = "0.1.0"
description = "Change the priority of Windows processes by name"
readme = "README.md"
authors = [
    { name = "Mike Clark", email = "mevanlc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2",
]

[project.scripts]
renice = "renice_win_py.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
